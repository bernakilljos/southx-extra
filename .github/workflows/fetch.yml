name: fetch
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Grab
      run: pip install beautifulsoup4 && python fetch.py
    - name: commit
      run: |
        git config user.name x
        git config user.email x@y.zz
        git add data
        git commit -m fetched || true
        git push
